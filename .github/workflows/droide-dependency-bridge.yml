name: Temporary Droide Dependency Bridge

on:
  push:
    paths:
      - ".github/workflows/droide-dependency-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droide-dependency-bridge
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up exact Temurin JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17.0.20.1"
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install exact Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 5 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip \
            -o gradle-8.13-bin.zip
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  gradle-8.13-bin.zip" | sha256sum -c -
          unzip -q gradle-8.13-bin.zip
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Generate exact Droide dependency seed
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/droide-seed"
          mkdir -p "$root/app/src/main"
          cat > "$root/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              buildscript {
                  repositories {
                      maven {
                          name = "R8Releases"
                          url = uri("https://storage.googleapis.com/r8-releases/raw")
                          content { includeModule("com.android.tools", "r8") }
                      }
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath("com.android.tools:r8:9.1.29")
                  }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DroideDependencySeed"
          include(":app")
          EOF

          cat > "$root/gradle.properties" <<'EOF'
          android.useAndroidX=true
          EOF

          cat > "$root/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.4.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.4.0" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.4.0" apply false
          }
          EOF

          cat > "$root/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          android {
              namespace = "com.baystudio.droide.seed"
              compileSdk = 36
              buildToolsVersion = "36.0.0"
              defaultConfig {
                  applicationId = "com.baystudio.droide.seed"
                  minSdk = 29
                  targetSdk = 36
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation("org.lsposed.hiddenapibypass:hiddenapibypass:6.1")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.2")
              implementation("io.github.rosemoe:editor:0.24.6")
              implementation("io.github.rosemoe:language-textmate:0.24.6")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okio:okio-jvm:3.17.0")
              implementation("org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r")
              implementation("androidx.documentfile:documentfile:1.1.0")
              implementation("org.jsoup:jsoup:1.18.1")
              implementation("io.coil-kt:coil-compose:2.7.0")
          }

          tasks.register("seedDependencies") {
              doLast {
                  listOf("debugCompileClasspath", "debugRuntimeClasspath").forEach { name ->
                      println("Resolving " + name)
                      configurations.getByName(name).resolve()
                  }
              }
          }
          EOF

          cat > "$root/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application />
          </manifest>
          EOF
          echo "SEED_ROOT=$root" >> "$GITHUB_ENV"

      - name: Resolve exact Droide dependencies
        working-directory: ${{ env.SEED_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --refresh-dependencies :app:seedDependencies

      - name: Package relocatable cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-root/caches"
          cp -a "$HOME/.gradle/caches/modules-2" "$RUNNER_TEMP/cache-root/caches/"
          tar --zstd -cf "$RUNNER_TEMP/droide-gradle-modules.tar.zst" -C "$RUNNER_TEMP/cache-root" caches
          sha256sum "$RUNNER_TEMP/droide-gradle-modules.tar.zst" > "$RUNNER_TEMP/SHA256SUM.txt"
          du -h "$RUNNER_TEMP/droide-gradle-modules.tar.zst"

      - name: Publish temporary public bridge chunks
        shell: bash
        run: |
          set -euo pipefail
          out="tmp/droide-dependency-seed"
          rm -rf "$out"
          mkdir -p "$out"
          split -b 80M -d -a 2 "$RUNNER_TEMP/droide-gradle-modules.tar.zst" "$out/droide-gradle-modules.tar.zst.part-"
          cp "$RUNNER_TEMP/SHA256SUM.txt" "$out/SHA256SUM.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "ci: publish temporary Droide dependency bridge"
          git pull --rebase origin main
          git push origin HEAD:main
