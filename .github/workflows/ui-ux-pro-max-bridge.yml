name: UI UX Pro Max Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-ux-pro-max-bridge.yml'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v2.15.0"
          curl --fail --location --retry 3             "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill/archive/refs/tags/${VERSION}.zip"             -o "ui-ux-pro-max-skill-${VERSION}.zip"
          sha256sum "ui-ux-pro-max-skill-${VERSION}.zip" > "ui-ux-pro-max-skill-${VERSION}.sha256"

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-pro-max-skill-v2.15.0
          path: |
            ui-ux-pro-max-skill-v2.15.0.zip
            ui-ux-pro-max-skill-v2.15.0.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
