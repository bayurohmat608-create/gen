name: Droide CP73C dependency bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/droide-cp73c-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install verified Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.13/bin/gradle --version

      - name: Resolve exact Droide remote dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/droide-deps "$HOME/.gradle/caches/modules-2"
          mkdir -p /tmp/droide-deps
          cat > /tmp/droide-deps/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              buildscript {
                  repositories {
                      maven {
                          name = "R8Releases"
                          url = uri("https://storage.googleapis.com/r8-releases/raw")
                          content { includeModule("com.android.tools", "r8") }
                      }
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath("com.android.tools:r8:9.1.29")
                  }
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DroideDependencyBootstrap"
          EOF

          cat > /tmp/droide-deps/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.4.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.4.0" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.4.0" apply false
          }

          val droideDeps by configurations.creating {
              isCanBeConsumed = false
              isCanBeResolved = true
          }

          dependencies {
              add("droideDeps", "androidx.core:core-ktx:1.13.1")
              add("droideDeps", "androidx.activity:activity-compose:1.9.2")
              add("droideDeps", "androidx.datastore:datastore-preferences:1.1.1")
              add("droideDeps", platform("androidx.compose:compose-bom:2024.09.00"))
              add("droideDeps", "androidx.compose.ui:ui")
              add("droideDeps", "androidx.compose.material3:material3")
              add("droideDeps", "androidx.compose.material:material-icons-extended")
              add("droideDeps", "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
              add("droideDeps", "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.2")
              add("droideDeps", "io.github.Rosemoe.sora-editor:editor:0.23.6")
              add("droideDeps", "io.github.Rosemoe.sora-editor:language-textmate:0.23.6")
              add("droideDeps", "com.squareup.okhttp3:okhttp:4.12.0")
              add("droideDeps", "com.squareup.okio:okio-jvm:3.17.0")
              add("droideDeps", "org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r")
              add("droideDeps", "androidx.documentfile:documentfile:1.1.0")
              add("droideDeps", "junit:junit:4.13.2")
              add("droideDeps", "org.jsoup:jsoup:1.18.1")
              add("droideDeps", "io.coil-kt:coil-compose:2.7.0")
          }

          tasks.register("resolveDroideDeps") {
              doLast {
                  val files = configurations["droideDeps"].resolve()
                  println("CP73C_RESOLVED_REMOTE_FILES=" + files.size)
              }
          }
          EOF

          cd /tmp/droide-deps
          /opt/gradle-8.13/bin/gradle --no-daemon --stacktrace --refresh-dependencies help resolveDroideDeps

      - name: Build portable dependency transport bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          modules = pathlib.Path.home()/".gradle/caches/modules-2"
          metadata = modules/"metadata-2.107"
          files21 = modules/"files-2.1"
          assert metadata.is_dir(), metadata
          assert files21.is_dir(), files21
          entries=[]
          paths=[]
          for p in sorted(modules.rglob("*")):
              if p.is_symlink() or not p.is_file():
                  continue
              rel=p.relative_to(modules).as_posix()
              if p.name=="gc.properties" or p.suffix==".lock":
                  continue
              data=p.read_bytes()
              entries.append({"path":rel,"size":len(data),"sha256":hashlib.sha256(data).hexdigest()})
              paths.append((p,rel,data))
          manifest={
              "schema":1,
              "kind":"droide-gradle-dependency-cache",
              "gradleVersion":"8.13",
              "metadataFormat":"metadata-2.107",
              "buildConfigSha256":"1118980861cf13d987c65a0c60bffc78d84107f4ea81220b8390049b0653d523",
              "seedSourceTreeSha256":"TRANSPORT_ONLY_NOT_SOURCE_CERTIFIED",
              "realBuildEvidenceSha256":"TRANSPORT_ONLY_NOT_SOURCE_CERTIFIED",
              "fileCount":len(entries),
              "files":entries,
              "excludes":["*.lock","gc.properties"],
              "consumerEnv":"GRADLE_RO_DEP_CACHE",
              "transport":"github-actions-official-repositories-cp73c"
          }
          out=pathlib.Path("/tmp/droide-cp73c-dependency-cache.zip")
          fixed=(2020,1,1,0,0,0)
          def put(z,name,data):
              info=zipfile.ZipInfo(name,fixed)
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=0o100644<<16
              z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          with zipfile.ZipFile(out,"w",allowZip64=True) as z:
              put(z,"manifest.json",(json.dumps(manifest,indent=2,sort_keys=True)+"\n").encode())
              for p,rel,data in paths:
                  put(z,"modules-2/"+rel,data)
          prov=[]
          prov.append("CP73C transport-only dependency cache")
          prov.append("gradle=8.13")
          prov.append("repositories=R8 official, Google Maven, Maven Central, Gradle Plugin Portal")
          prov.append("bundle_sha256="+hashlib.sha256(out.read_bytes()).hexdigest())
          for needle in [
              ("r8-9.1.29.jar","r8"),
              ("gradle-8.13.2.jar","agp"),
              ("kotlin-gradle-plugin-2.4.0-gradle813.jar","kgp"),
          ]:
              matches=list(files21.rglob(needle[0]))
              if matches:
                  p=matches[0]
                  prov.append(f"{needle[1]}={needle[0]} sha256={hashlib.sha256(p.read_bytes()).hexdigest()} size={p.stat().st_size}")
              else:
                  prov.append(f"{needle[1]}={needle[0]} MISSING")
          pathlib.Path("/tmp/CP73C-PROVENANCE.txt").write_text("\n".join(prov)+"\n")
          print("\n".join(prov))
          print("CP73C_CACHE_FILES="+str(len(entries)))
          PY

      - name: Upload dependency bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-dependency-cache
          path: |
            /tmp/droide-cp73c-dependency-cache.zip
            /tmp/CP73C-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 1
