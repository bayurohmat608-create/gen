name: Droide CP73C dependency bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/droide-cp73c-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install verified Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.13/bin/gradle --version

      - name: Resolve exact Droide remote dependency graph with Android attributes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/droide-deps "$HOME/.gradle/caches/modules-2"
          mkdir -p /tmp/droide-deps/app/src/main/java/com/example/bootstrap

          cat > /tmp/droide-deps/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              buildscript {
                  repositories {
                      maven {
                          name = "R8Releases"
                          url = uri("https://storage.googleapis.com/r8-releases/raw")
                          content { includeModule("com.android.tools", "r8") }
                      }
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath("com.android.tools:r8:9.1.29")
                  }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DroideDependencyBootstrap"
          include(":app")
          EOF

          cat > /tmp/droide-deps/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > /tmp/droide-deps/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.4.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.4.0" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.4.0" apply false
          }
          EOF

          cat > /tmp/droide-deps/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          android {
              namespace = "com.example.bootstrap"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.example.bootstrap"
                  minSdk = 29
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1"
              }
              buildFeatures {
                  compose = true
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.2")
              implementation("io.github.Rosemoe.sora-editor:editor:0.23.6")
              implementation("io.github.Rosemoe.sora-editor:language-textmate:0.23.6")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okio:okio-jvm:3.17.0")
              implementation("org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r")
              implementation("androidx.documentfile:documentfile:1.1.0")
              testImplementation("junit:junit:4.13.2")
              implementation("org.jsoup:jsoup:1.18.1")
              implementation("io.coil-kt:coil-compose:2.7.0")
          }
          EOF

          cat > /tmp/droide-deps/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme"/>
          </manifest>
          EOF
          mkdir -p /tmp/droide-deps/app/src/main/res/values
          cat > /tmp/droide-deps/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>
          </resources>
          EOF
          cat > /tmp/droide-deps/app/src/main/java/com/example/bootstrap/Bootstrap.kt <<'EOF'
          package com.example.bootstrap
          class Bootstrap
          EOF

          cd /tmp/droide-deps
          /opt/gradle-8.13/bin/gradle --no-daemon --stacktrace --refresh-dependencies \
            :app:compileDebugKotlin :app:testDebugUnitTest --dry-run
          /opt/gradle-8.13/bin/gradle --no-daemon --stacktrace \
            :app:compileDebugKotlin :app:dependencies

      - name: Build portable dependency transport bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          modules = pathlib.Path.home()/".gradle/caches/modules-2"
          metadata = modules/"metadata-2.107"
          files21 = modules/"files-2.1"
          assert metadata.is_dir(), metadata
          assert files21.is_dir(), files21
          entries=[]
          paths=[]
          for p in sorted(modules.rglob("*")):
              if p.is_symlink() or not p.is_file():
                  continue
              rel=p.relative_to(modules).as_posix()
              if p.name=="gc.properties" or p.suffix==".lock":
                  continue
              data=p.read_bytes()
              entries.append({"path":rel,"size":len(data),"sha256":hashlib.sha256(data).hexdigest()})
              paths.append((p,rel,data))
          manifest={
              "schema":1,
              "kind":"droide-gradle-dependency-cache",
              "gradleVersion":"8.13",
              "metadataFormat":"metadata-2.107",
              "buildConfigSha256":"3f143e72b8343aa974defa8cb25e9ca6a472d1742a732ff4adfacdda62c585d6",
              "seedSourceTreeSha256":"TRANSPORT_ONLY_NOT_SOURCE_CERTIFIED",
              "realBuildEvidenceSha256":"TRANSPORT_ONLY_NOT_SOURCE_CERTIFIED",
              "fileCount":len(entries),
              "files":entries,
              "excludes":["*.lock","gc.properties"],
              "consumerEnv":"GRADLE_RO_DEP_CACHE",
              "transport":"github-actions-official-repositories-cp73c"
          }
          out=pathlib.Path("/tmp/droide-cp73c-dependency-cache.zip")
          fixed=(2020,1,1,0,0,0)
          def put(z,name,data):
              info=zipfile.ZipInfo(name,fixed)
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=0o100644<<16
              z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          with zipfile.ZipFile(out,"w",allowZip64=True) as z:
              put(z,"manifest.json",(json.dumps(manifest,indent=2,sort_keys=True)+"\n").encode())
              for p,rel,data in paths:
                  put(z,"modules-2/"+rel,data)

          prov=[]
          prov.append("CP73C transport-only dependency cache")
          prov.append("gradle=8.13")
          prov.append("repositories=R8 official, Google Maven, Maven Central, Gradle Plugin Portal")
          prov.append("bundle_sha256="+hashlib.sha256(out.read_bytes()).hexdigest())
          for filename,label in [
              ("r8-9.1.29.jar","r8"),
              ("gradle-8.13.2.jar","agp"),
              ("kotlin-gradle-plugin-2.4.0-gradle813.jar","kgp"),
          ]:
              matches=list(files21.rglob(filename))
              if matches:
                  p=matches[0]
                  prov.append(f"{label}={filename} sha256={hashlib.sha256(p.read_bytes()).hexdigest()} size={p.stat().st_size}")
              else:
                  prov.append(f"{label}={filename} MISSING")
          pathlib.Path("/tmp/CP73C-PROVENANCE.txt").write_text("\n".join(prov)+"\n")
          print("\n".join(prov))
          print("CP73C_CACHE_FILES="+str(len(entries)))
          PY

      - name: Split dependency bundle for bounded transport
        shell: bash
        run: |
          set -euo pipefail
          split -b 50M -d -a 2 /tmp/droide-cp73c-dependency-cache.zip /tmp/droide-cp73c-dependency-cache.part-
          test "$(find /tmp -maxdepth 1 -name 'droide-cp73c-dependency-cache.part-*' | wc -l)" -eq 6
          sha256sum /tmp/droide-cp73c-dependency-cache.part-* > /tmp/CP73C-PARTS-SHA256.txt
          cat /tmp/CP73C-PARTS-SHA256.txt

      - name: Upload dependency part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-final-part-00
          path: /tmp/droide-cp73c-dependency-cache.part-00
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependency part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-final-part-01
          path: /tmp/droide-cp73c-dependency-cache.part-01
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependency part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-final-part-02
          path: /tmp/droide-cp73c-dependency-cache.part-02
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependency part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-final-part-03
          path: /tmp/droide-cp73c-dependency-cache.part-03
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependency part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-final-part-04
          path: /tmp/droide-cp73c-dependency-cache.part-04
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependency part 05
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-final-part-05
          path: /tmp/droide-cp73c-dependency-cache.part-05
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependency provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droide-cp73c-final-provenance
          path: |
            /tmp/CP73C-PROVENANCE.txt
            /tmp/CP73C-PARTS-SHA256.txt
          if-no-files-found: error
          retention-days: 1
