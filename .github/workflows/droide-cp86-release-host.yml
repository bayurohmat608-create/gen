name: Cleanup Droide CP86 Transport
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'droide-cp86-transport'
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary release, artifacts and branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete droide-cp86-transport --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | select(.name | startswith("droide-cp86")) | .id' | while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/droide-cp86-transport" || true
