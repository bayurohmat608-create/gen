name: Droide CP91 Alpine Alias Probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'droide-cp91-bootstrap-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Alpine 3.24 ARM64 package aliases
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o main.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.24/main/aarch64/APKINDEX.tar.gz
          curl -fL --retry 3 -o community.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.24/community/aarch64/APKINDEX.tar.gz
          { tar -xOzf main.tar.gz APKINDEX; printf '\n'; tar -xOzf community.tar.gz APKINDEX; } > all.txt
          python3 - <<'PY'
          import re
          text=open("all.txt",encoding="utf-8").read()
          blocks=text.strip().split("\n\n")
          rows=[]
          for b in blocks:
              d={}
              for line in b.splitlines():
                  if len(line)>2 and line[1]==":":
                      d[line[0]]=line[2:]
              if "P" in d: rows.append((d["P"],d.get("V",""),d.get("p","")))
          pats=["clang","lld","ninja","openssh","erlang","scala","black","lsp","typescript","dart","dotnet","powershell","swift","haskell","ghc","solc","kotlin","pnpm","yarn","bun","poetry","uv","prettier","eslint"]
          for pat in pats:
              print("###",pat)
              for name,ver,provides in rows:
                  if pat.lower() in name.lower() or pat.lower() in provides.lower():
                      print(f"{name}={ver} provides={provides[:180]}")
          PY
