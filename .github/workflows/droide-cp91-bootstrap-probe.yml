name: Cleanup Droide CP91 Bootstrap Probe
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'droide-cp91-bootstrap-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary CP91 probe branch and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | select(.name | startswith("droide-cp91")) | .id' | while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/droide-cp91-bootstrap-probe" || true
