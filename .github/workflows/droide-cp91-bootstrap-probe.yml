name: Droide CP91 Bootstrap Hash Probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'droide-cp91-bootstrap-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact upstream bootstrap bytes
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o proot https://github.com/proot-me/proot/releases/download/v5.3.0/proot-v5.3.0-aarch64-static
          curl -fL --retry 3 -o alpine.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.2-aarch64.tar.gz
          printf 'PROOT_SIZE=%s\n' "$(stat -c %s proot)"
          printf 'PROOT_SHA256=%s\n' "$(sha256sum proot | awk '{print $1}')"
          printf 'ALPINE_SIZE=%s\n' "$(stat -c %s alpine.tar.gz)"
          printf 'ALPINE_SHA256=%s\n' "$(sha256sum alpine.tar.gz | awk '{print $1}')"
