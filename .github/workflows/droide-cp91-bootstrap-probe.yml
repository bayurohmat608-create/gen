name: Droide CP91 Alpine Rootfs Trust Probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'droide-cp91-bootstrap-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact Alpine minirootfs TLS and apk bootstrap files
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o alpine.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.2-aarch64.tar.gz
          echo "ROOTFS_SHA256=$(sha256sum alpine.tar.gz | awk '{print $1}')"
          mkdir rootfs
          tar -xzf alpine.tar.gz -C rootfs
          test -x rootfs/sbin/apk
          echo "APK_PRESENT=yes"
          if [ -e rootfs/etc/ssl/cert.pem ]; then
            echo "CERT_PEM_PRESENT=yes"
            ls -l rootfs/etc/ssl/cert.pem
          else
            echo "CERT_PEM_PRESENT=no"
          fi
          if [ -e rootfs/etc/ssl/certs/ca-certificates.crt ]; then
            echo "CA_BUNDLE_PRESENT=yes"
            stat -c '%s' rootfs/etc/ssl/certs/ca-certificates.crt
          else
            echo "CA_BUNDLE_PRESENT=no"
          fi
          echo "REPOSITORIES_BEGIN"
          cat rootfs/etc/apk/repositories 2>/dev/null || true
          echo "REPOSITORIES_END"
